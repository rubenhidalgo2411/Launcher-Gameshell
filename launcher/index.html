<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">

<body data-theme="classic">
<div id="boot"></div>
<div id="bgimg"></div>
<div id="bg"></div>
<div id="fx"></div>
<canvas id="fxb"></canvas>
<div id="hero"></div>
<div id="bhero"></div>
<div id="shade"></div>
<div id="top" class="tb-a-classic">
  <div id="tabs"><b>Juegos</b><span id="tweb">Web</span></div>

    <i id="av"></i>
    <svg id="pw" class="ic" viewBox="0 0 24 24"><path d="M12 3v9M6.5 6.8a8 8 0 1 0 11 0"/></svg>
  </div>
</div>
<div id="row"></div><div id="tname"></div>
<div id="info"><div id="title"></div><div id="sub"></div><div id="cta"></div></div>
<div id="acts"><button id="play">Jugar</button><button id="more" aria-label="Opciones">···</button></div>
<div id="hint" class="hb-a-classic"></div>

<div id="sc"><div id="sch"><button id="scb" aria-label="Volver">←</button><h2 id="sct"></h2><span id="scn"></span></div><div id="scm">Esta subconsola está vacía: pulsa «Añadir juego» o mueve juegos desde sus Opciones → Mover a una subconsola.</div><div id="scg"></div><div id="sch2"></div></div>
<div id="mvbar"><button data-d="-1" aria-label="Mover a la izquierda">◀</button><span id="mvt"></span><button data-d="1" aria-label="Mover a la derecha">▶</button><button data-d="0" class="ok">Listo</button></div>
<div id="ov"><div id="mn"></div></div>
<div id="tray"><div id="ttabs"></div><div id="tview"><div id="ttrack"></div></div><div id="tinfo"><b id="tn"></b><span id="td"></span></div><div id="thelp"></div></div>

<div id="ld"><div><i></i>Iniciando <b></b>…</div></div>
<div id="psw"><div id="pswbg"></div><div id="pswmsg"></div></div>
<div id="intro"></div>
